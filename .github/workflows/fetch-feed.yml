name: Fetch podcast feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch RSS and generate posts
        run: |
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors --user-agent "between-deployments-feed/1.0" "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fapi.substack.com%2Ffeed%2Fpodcast%2F2886741.rss" -o feed.json
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors --user-agent "between-deployments-feed/1.0" "https://www.youtube.com/feeds/videos.xml?playlist_id=PLZ1XeY_ukcfY" -o videos.xml
          python3 scripts/rss_to_posts.py feed.json _posts videos.xml
          rm feed.json videos.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts
          git diff --cached --quiet || git commit -m "Update episodes $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push
