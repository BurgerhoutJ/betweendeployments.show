# Site
name: "Between Deployments"
title: "Between Deployments"
description: "Conversations about modern workplace IT — Intune, Entra ID, Windows 365, and cloud-native device management. Hosted by Jeroen Burgerhout."
logo: "assets/images/logo.png"
favicon: "assets/images/logo.png"
baseurl: ""
url: "https://betweendeployments.show"
google_analytics: "G-0D9P7TTVR6"
disqus:
mailchimp-list:
include: ["_pages"]
permalink: /:title/

# Comments are disabled site-wide (no Disqus account configured)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false

# Theme
remote_theme: codebygina/mediumish-theme-jekyll

# Podcast platforms (used for the "Listen on" links on episode cards)
podcast:
  substack: "https://www.burgerhout.org/podcast"
  rss: "https://api.substack.com/feed/podcast/2886741.rss"
  spotify: "https://open.spotify.com/show/7hgphI6WYj6ifPbiZy4aOW"
  apple_podcasts: "https://podcasts.apple.com/us/podcast/between-deployments/id6803070775"
  youtube: ""
  youtube_playlist: "https://www.youtube.com/playlist?list=PLDh2NAUKcXvc"

# Authors
authors:
  jeroen:
    name: Jeroen Burgerhout
    display_name: Jeroen Burgerhout
    avatar: "assets/images/avatar.png"
    email: burgerhoutj@substack.com
    web: https://www.burgerhout.org
    twitter: https://twitter.com/BurgerhoutJ
    bluesky: https://bsky.app/profile/jeroen.burgerhout.org
    linkedin: https://www.linkedin.com/in/jeroenburgerhout/
    description: "Microsoft MVP. Conversations about modern workplace IT — Intune, Entra ID, Windows 365, and everything cloud-native device management."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Pagination
paginate: 9
paginate_path: /page:num/

# Other
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Lazy Images
lazyimages: "disabled"

# Adsense
adsense: "disabled"

exclude: [scripts, feed.xml.bak, README.md, Gemfile, Gemfile.lock]
