{%- assign audio_url = include.post.audio | default: "" -%}
{%- if audio_url != "" -%}
<div class="episode-player">
    <button class="player-btn" type="button" aria-label="Play episode">
        <svg class="icon-play" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l10-5.5-10-5.5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5h3v11H4v-11zm5 0h3v11H9v-11z"/></svg>
    </button>
    <div class="player-track">
        <div class="player-bar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="player-bar-fill"></div></div>
        <div class="player-time"><span class="player-elapsed">0:00</span><span class="player-duration"></span></div>
    </div>
    <audio preload="none" src="{{ audio_url }}"></audio>
</div>
{%- endif -%}
